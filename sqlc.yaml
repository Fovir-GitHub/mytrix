version: "2"

sql:
  - engine: "sqlite"
    schema: "internal/assets/sql/schema/"
    queries: "internal/assets/sql/queries/"
    strict_function_checks: true
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "database/sql"
        emit_db_tags: true
        emit_methods_with_db_argument: false
        emit_interface: false
        emit_exact_table_names: false
        emit_params_struct_pointers: true
        rename:
          rss_feed: "RSSFeed"
          rss_item: "RSSItem"
