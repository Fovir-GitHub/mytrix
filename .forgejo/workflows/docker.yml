name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - v*

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Buildx
        run: |
          docker buildx create --use --name mybuilder --driver docker-container
          docker buildx inspect --bootstrap

      - name: Login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | \
          docker login docker.io -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and Push
        run: |
          IMAGE="docker.io/fovir/mytrix"
          TAG="${{ github.ref_type == 'tag' && github.ref_name || 'main' }}"
          VERSION="${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}"

          TAGS="-t $IMAGE:$TAG"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAGS="$TAGS -t $IMAGE:latest"
          fi

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$VERSION" \
            --push \
            $TAGS \
            .
