name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Buildx
        run: |
          docker buildx create --use --name mybuilder --driver docker-container
          docker buildx inspect --bootstrap

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | \
          docker login docker.io -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and Push
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_DOCKER="docker.io/fovir/mytrix"
          IMAGE_GHCR="ghcr.io/$OWNER/mytrix"
          TAG="${{ github.ref_type == 'tag' && github.ref_name || 'main' }}"
          VERSION="${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}"

          TAGS="-t $IMAGE_DOCKER:$TAG -t $IMAGE_GHCR:$TAG"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAGS="$TAGS -t $IMAGE_DOCKER:latest -t $IMAGE_GHCR:latest"
          fi

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$VERSION" \
            --push \
            $TAGS \
            .
