name: Build and Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: linux
            arch: arm
            goarm: "6"
          - os: linux
            arch: arm
            goarm: "7"
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
            ext: ".exe"

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          VERSION="${{ github.ref_name }}"
          EXT="${{ matrix.ext }}"
          ARCH="${{ matrix.arch }}${{ matrix.goarm }}"
          BINARY="mytrix-${{ matrix.os }}-${ARCH}${EXT}"

          CGO_ENABLED=0 \
          go build \
            -ldflags "-X codeberg.org/Fovir/mytrix/internal/version.Version=${VERSION}" \
            -tags goolm \
            -o "dist/$BINARY" \
            ./cmd/bot

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.goarm }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true

      - name: List files
        run: ls -la

      - name: Generate checksums
        run: sha256sum mytrix-* > checksums.txt

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mytrix-*
            checksums.txt
